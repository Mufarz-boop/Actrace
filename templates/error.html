<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#142D4E">

    <title>{{ error_code }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/errors.css') }}">

    <script src="{{ url_for('static', filename='js/errors.js') }}"
            defer></script>
</head>

<body class="error-page">

    <main class="error-container">
        <section class="error-card">

            <div class="error-brand">
                <span class="brand-mark">A</span>
                <span>ACTRACE</span>
            </div>

            <div class="error-illustration error-{{ error_code }}">
                <span class="error-icon">{{ error_icon }}</span>
            </div>

            <p class="error-label">{{ error_label }}</p>

            <h1 class="error-code">{{ error_code }}</h1>

            <h2>{{ error_title }}</h2>

            <p class="error-description">
                {{ error_message }}
            </p>

            <div class="error-actions">
                <a href="{{ url_for('index') }}"
                   class="error-button primary">
                    Kembali ke Beranda
                </a>

                {% if error_action == 'reload' %}
                <button type="button"
                        class="error-button secondary"
                        data-reload>
                    Coba Lagi
                </button>
                {% else %}
                <button type="button"
                        class="error-button secondary"
                        data-go-back>
                    Halaman Sebelumnya
                </button>
                {% endif %}
            </div>

            <p class="error-reference">
                HTTP ERROR {{ error_code }}
            </p>

        </section>

        <footer class="error-footer">
            &copy; 2026 ACTRACE. Setiap aktivitas meninggalkan jejak.
        </footer>
    </main>

</body>
</html>
